<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micro:bitada 2027 – Tria la teva aula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comu.css">
<style>
.bg{filter:blur(6px);transform:scale(1.05);opacity:.35}
.scrim{background:linear-gradient(180deg,rgba(7,10,25,.75) 0%,rgba(7,10,25,.92) 45%,#070a19 100%)}
.wrap{max-width:1220px;padding-bottom:64px;gap:36px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 12px 22px;background:#070a19;border:2px solid rgba(251,247,255,.12);border-radius:20px;cursor:pointer;font-family:'Manrope',sans-serif;transition:transform .25s,box-shadow .25s,opacity .25s,border-color .25s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.card .nom{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:18px;line-height:1.2;text-align:center}
.card .col{font-size:13px;font-weight:800;letter-spacing:.16em;color:#a59dc2}
.codi{max-width:640px}
.codi label{font-size:16px;font-weight:800}
.fila{display:flex;gap:12px;flex-wrap:wrap}
#codi{flex:1 1 260px;min-width:0;height:58px;font-size:22px;font-weight:800;letter-spacing:.25em;text-transform:uppercase}
#codi::placeholder{letter-spacing:.1em}
#entra{height:58px;color:#120d24}
.ok{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ok a{height:48px;padding:0 22px;border-radius:10px;border:1.5px solid;color:#fbf7ff;font-size:16px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<img class="bg" src="portada.jpg" alt="" aria-hidden="true">
<div class="scrim" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Tornar a l'inici</a>
    <span class="brand">micro:bitada <span class="gold">2027</span></span>
  </div>
  <div class="head">
    <div class="kicker"><i></i><span>ACCÉS A L'ACADÈMIA</span><i></i></div>
    <h1>Tria la teva aula</h1>
    <p class="lead">Selecciona l'escut de la teva aula i escriu el codi secret que t'ha donat el teu professor o professora.</p>
  </div>
  <div class="grid" id="grid"></div>
  <p class="muted" id="hint" style="text-align:center">Selecciona un escut per continuar.</p>
  <div class="panel codi in hidden" id="panel">
    <label for="codi">Codi de l'<span id="selnom"></span></label>
    <div class="fila">
      <input id="codi" class="field" type="text" autocomplete="off" spellcheck="false" maxlength="12" placeholder="Escriu el codi">
      <button type="button" class="btn" id="entra">Entra a l'aula</button>
    </div>
    <p class="err hidden" id="msg" role="status"></p>
    <div class="ok hidden" id="ok" role="status">
      <span style="font-size:15px;color:#cfc8e6">Codi correcte. Benvinguts a l'aula!</span>
      <a id="continua" href="grup.html">Continua</a>
    </div>
  </div>
</div>
<script src="comu.js"></script>
<script>
let picked = null;
const $ = (id) => document.getElementById(id);
function render() {
  $('grid').innerHTML = ORDRE.map((id) => {
    const a = AULES[id], on = picked === id;
    const st = 'border-color:' + (on ? a.hex : 'rgba(251,247,255,.12)') + ';box-shadow:' + (on ? '0 0 0 1px ' + a.hex + ',0 18px 60px -10px ' + a.hex + '99' : 'none') + ';opacity:' + (picked && !on ? .55 : 1);
    return '<button type="button" class="card" data-id="' + id + '" aria-pressed="' + on + '" style="' + st + '"><img src="' + a.img + '" alt="Escut de l’' + a.nom + '"><span class="nom" style="color:' + a.hex + '">' + a.nom + '</span><span class="col">' + a.color + '</span></button>';
  }).join('');
  $('hint').classList.toggle('hidden', !!picked);
  $('panel').classList.toggle('hidden', !picked);
  if (picked) {
    const a = AULES[picked];
    $('panel').style.borderColor = a.hex;
    $('selnom').textContent = a.nom; $('selnom').style.color = a.hex;
    $('entra').style.background = a.hex;
    $('continua').style.borderColor = a.hex;
  }
}
$('grid').addEventListener('click', (e) => {
  const b = e.target.closest('.card'); if (!b) return;
  picked = b.dataset.id; $('codi').value = ''; $('msg').classList.add('hidden'); $('ok').classList.add('hidden');
  render(); $('codi').focus();
});
function entra() {
  const c = $('codi').value.trim().toUpperCase();
  $('ok').classList.add('hidden');
  if (!c) { $('msg').textContent = 'Escriu el codi que t’ha donat el teu professor o professora.'; $('msg').classList.remove('hidden'); return; }
  if (AULES[picked].codi && c === AULES[picked].codi) {
    $('msg').classList.add('hidden');
    desaAula(picked);
    $('continua').href = 'grup.html?aula=' + picked;
    $('ok').classList.remove('hidden');
  } else { $('msg').textContent = 'Aquest codi no és correcte. Revisa’l i torna-ho a provar.'; $('msg').classList.remove('hidden'); }
}
$('entra').addEventListener('click', entra);
$('codi').addEventListener('keydown', (e) => { if (e.key === 'Enter') entra(); });
$('codi').addEventListener('input', () => { $('msg').classList.add('hidden'); $('ok').classList.add('hidden'); });
render();
</script>
</body>
</html>
