<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micro:bitada 2027 – El repartiment de les aules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#070a19;color:#fbf7ff}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%;filter:blur(3px);transform:scale(1.04);opacity:.7;z-index:0}
.scrim{position:fixed;inset:0;background:linear-gradient(180deg,rgba(7,10,25,.5) 0%,rgba(7,10,25,.75) 45%,rgba(7,10,25,.94) 100%);z-index:0}
.wrap{position:relative;z-index:1;max-width:1320px;min-height:100vh;margin:0 auto;padding:28px 24px 0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:18px}
.gold{color:#f2c76b}
.row{flex:1;display:flex;gap:28px;align-items:stretch}
.mestra{flex:0 0 340px;display:flex;flex-direction:column;justify-content:flex-end}
.bubble{position:relative;z-index:1;margin:0 8px -30px 20px;padding:18px 20px;border-radius:18px;background:rgba(7,10,25,.93);border:1.5px solid #f2c76b;box-shadow:0 16px 40px -16px rgba(0,0,0,.8)}
.bubble .who{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.16em;color:#f2c76b}
.bubble .say{margin:0;font-size:16px;line-height:1.55;color:#f1edfa}
.mestra img{display:block;width:100%;height:auto;-webkit-mask-image:radial-gradient(ellipse 62% 72% at 50% 44%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 62% 72% at 50% 44%,#000 60%,transparent 100%);animation:left .9s ease-out both}
.main{flex:1 1 600px;min-width:0;display:flex;flex-direction:column;gap:24px;padding-bottom:56px}
.head{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.kicker{display:flex;align-items:center;gap:12px;color:#f2c76b;font-size:13px;font-weight:800;letter-spacing:.22em}
.kicker i{width:28px;height:2px;background:#f2c76b}
h1{margin:0;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:42px;line-height:1.1}
.panel{align-self:center;width:100%;max-width:760px;padding:22px;border-radius:20px;background:rgba(7,10,25,.9);border:1px solid rgba(251,247,255,.14);display:flex;flex-direction:column;gap:14px}
.ask{max-width:620px;padding:32px;align-items:center;text-align:center;gap:22px}
.ask label{font-size:20px;font-weight:800}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:56px;height:56px;border-radius:14px;border:1.5px solid rgba(251,247,255,.3);background:#0d1028;color:#fbf7ff;font-size:28px;font-weight:700;cursor:pointer}
.stepper input{width:120px;height:72px;text-align:center;border-radius:14px;border:1.5px solid #3a3560;background:#0d1028;color:#fbf7ff;font-family:'Cinzel',Georgia,serif;font-size:40px;font-weight:700}
.muted{margin:0;font-size:16px;line-height:1.5;color:#cfc8e6}
.err{margin:0;font-size:15px;color:#ffb3b3}
.warn{margin:0;font-size:14px;line-height:1.5;color:#ffcf9e}
.btn{height:52px;padding:0 22px;border-radius:12px;border:0;background:#f2c76b;color:#1a1230;font-family:'Manrope',sans-serif;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:#fbf7ff;border:1.5px solid rgba(251,247,255,.5)}
.btn.line{background:transparent;color:#f2c76b;border:1.5px solid #f2c76b;height:44px;font-size:15px}
.btn.wide{width:100%;height:58px;font-size:17px}
.btn:focus-visible,.stepper button:focus-visible{outline:3px solid #fbf7ff;outline-offset:3px}
.progress{margin:0;text-align:center;font-size:20px;font-weight:800}
.shields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;perspective:800px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 10px 16px;border-radius:18px;background:#070a19;border:2px solid rgba(251,247,255,.12);transition:transform .12s,box-shadow .2s,border-color .12s,opacity .2s}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.card .nom{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:15px;line-height:1.2;text-align:center}
.card .cnt{font-size:14px;font-weight:800;color:#d9d3ec}
.card .big{font-family:'Cinzel',Georgia,serif;font-size:30px;font-weight:700}
.card .list{font-size:13px;line-height:1.5;text-align:center;color:#b3abcc}
.spin img{animation:flip .7s linear infinite}
.result{align-self:center;display:flex;align-items:center;gap:16px;padding:14px 24px 14px 14px;border-radius:999px;background:rgba(7,10,25,.94);border:2px solid;animation:pop .5s ease-out both;font-size:20px;font-weight:800}
.result img{width:56px;height:56px;border-radius:999px;object-fit:cover}
.mbrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:999px;display:inline-block;margin-right:10px}
.sim{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lbl{font-size:13px;font-weight:800;letter-spacing:.12em;color:#a59dc2}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:rgba(7,10,25,.88);border:1px solid;font-size:14px;color:#f1edfa}
.center{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.hidden{display:none !important}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes left{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:1100px){.shields{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:960px){.row{flex-direction:column}.mestra{flex:0 0 auto;width:100%;max-width:560px;align-self:center}.mestra img{display:none}.bubble{margin:0}.main{padding-bottom:48px}}
@media (max-width:600px){.shields{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:32px}}
</style>
</head>
<body>
<img class="bg" src="img/hall.jpg" alt="" aria-hidden="true">
<div class="scrim" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <span class="brand">micro:bitada <span class="gold">2027</span></span>
  </div>
  <div class="row">
    <div class="mestra">
      <div class="bubble" role="status" aria-live="polite">
        <p class="who">EL DIRECTOR DE L'ACADÈMIA</p>
        <p class="say" id="say"></p>
      </div>
      <img src="img/director.jpg" alt="El director de l'Acadèmia, amb levita blau fosc brodada en or i un pergamí a la mà">
    </div>
    <div class="main">
      <div class="head">
        <div class="kicker"><i></i><span>EL HALL DE L'ACADÈMIA</span><i></i></div>
        <h1>El repartiment de les aules</h1>
      </div>

      <div id="step-ask" class="panel ask">
        <label for="total">Quants alumnes hi ha a la classe?</label>
        <div class="stepper">
          <button type="button" id="dec" aria-label="Un alumne menys">−</button>
          <input id="total" type="number" min="5" max="40" value="25">
          <button type="button" id="inc" aria-label="Un alumne més">+</button>
        </div>
        <p class="muted" id="preview"></p>
        <button type="button" class="btn wide" id="start">Comencem el repartiment</button>
        <p class="err hidden" id="askmsg"></p>
      </div>

      <div id="step-draw" class="hidden" style="display:flex;flex-direction:column;gap:22px">
        <p class="progress" id="progress"></p>
        <div class="shields" id="shields"></div>
        <div id="result" class="result hidden" role="status"></div>
        <div class="panel">
          <div class="mbrow">
            <div><span class="dot" id="mbdot" style="background:#6f6890"></span><strong id="mbtxt">micro:bit no connectada</strong></div>
            <button type="button" class="btn line" id="connect">Connecta la micro:bit</button>
          </div>
          <p class="warn hidden" id="mbmsg"></p>
          <div class="sim">
            <span class="lbl">SIMULACIÓ</span>
            <button type="button" class="btn" id="btnA">Botó A · Fer girar</button>
            <button type="button" class="btn ghost" id="btnS">Sacseja · Aturar</button>
          </div>
        </div>
        <div id="logwrap" class="hidden" style="align-self:center;width:100%;max-width:760px;display:flex;flex-direction:column;gap:8px">
          <span class="lbl">ÚLTIMS REPARTIMENTS</span>
          <div class="chips" id="log"></div>
        </div>
      </div>

      <div id="step-done" class="hidden" style="display:flex;flex-direction:column;gap:20px">
        <p class="muted" style="text-align:center;font-size:18px" id="donetxt"></p>
        <div class="shields" id="summary"></div>
        <div class="center"><button type="button" class="btn ghost" id="reset">Torna a repartir</button></div>
      </div>
    </div>
  </div>
</div>

<script>
const AULES = [
  { nom: 'Aula de l’Ametller', curt: 'Ametller', hex: '#f5c94a', img: 'img/escut-ametller.jpg' },
  { nom: 'Aula de la Vinya', curt: 'Vinya', hex: '#ff8c3a', img: 'img/escut-vinya.jpg' },
  { nom: 'Aula de l’Olivera', curt: 'Olivera', hex: '#a6d160', img: 'img/escut-olivera.jpg' },
  { nom: 'Aula del Garrofer', curt: 'Garrofer', hex: '#c99366', img: 'img/escut-garrofer.jpg' },
  { nom: 'Aula de la Figuera', curt: 'Figuera', hex: '#b98cff', img: 'img/escut-figuera.jpg' }
];
const S = { step: 'ask', total: 25, quota: [0,0,0,0,0], count: [0,0,0,0,0], log: [], spinning: false, stopping: false, hi: -1, result: -1 };
let iv = null, timers = [];
const $ = (id) => document.getElementById(id);
const assigned = () => S.count.reduce((a, b) => a + b, 0);

function preview() {
  const n = parseInt($('total').value, 10);
  if (!(n >= 5 && n <= 40)) return 'Entre 5 i 40 alumnes.';
  const b = Math.floor(n / 5), r = n % 5;
  if (r === 0) return 'Cada aula tindrà ' + b + ' aprenents.';
  return r + (r === 1 ? ' aula tindrà ' : ' aules tindran ') + (b + 1) + ' aprenents i ' + (5 - r) + (5 - r === 1 ? ' en tindrà ' : ' en tindran ') + b + '.';
}

function say() {
  const a = assigned();
  if (S.step === 'ask') return 'Benvinguts al hall! Abans de repartir els aprenents per les aules, digueu-me: quants alumnes hi ha a la classe?';
  if (S.step === 'done') return 'Fet! Tots els aprenents ja tenen aula. Ara cada aula pot formar els seus grups.';
  if (S.stopping) return 'Aturant la màgia...';
  if (S.spinning) return 'Els escuts giren... Sacseja la micro:bit quan vulguis!';
  if (S.result >= 0) {
    const nom = AULES[S.result].nom;
    return a >= S.total ? 'L’últim aprenent anirà a l’' + nom + '! Prem A per veure el resum.' : 'L’aprenent ' + S.log[0].n + ' anirà a l’' + nom + '! Que s’acosti el següent i premi A.';
  }
  return 'Que s’acosti el primer aprenent. Prem el botó A de la micro:bit per fer girar els escuts i sacseja-la per aturar-los.';
}

function render() {
  $('say').textContent = say();
  $('step-ask').classList.toggle('hidden', S.step !== 'ask');
  $('step-draw').classList.toggle('hidden', S.step !== 'draw');
  $('step-done').classList.toggle('hidden', S.step !== 'done');
  $('preview').textContent = preview();
  if (S.step === 'draw') {
    const a = assigned();
    $('progress').textContent = a >= S.total && !S.spinning && !S.stopping ? 'Tots els ' + S.total + ' aprenents tenen aula' : 'Aprenent ' + Math.min(a + 1, S.total) + ' de ' + S.total;
    const moving = S.spinning || S.stopping;
    $('shields').innerHTML = AULES.map((au, i) => {
      const hot = moving && S.hi === i, won = S.result === i, full = S.count[i] >= S.quota[i];
      const st = [
        'border-color:' + (hot || won ? au.hex : 'rgba(251,247,255,.12)'),
        'box-shadow:' + (won ? '0 0 0 2px ' + au.hex + ',0 20px 60px -10px ' + au.hex : hot ? '0 0 0 1px ' + au.hex + ',0 12px 40px -12px ' + au.hex : 'none'),
        'transform:' + (hot || won ? 'translateY(-6px) scale(1.04)' : 'none'),
        'opacity:' + (moving ? (hot ? 1 : .55) : (full && !won ? .45 : 1))
      ].join(';');
      return '<div class="card' + (S.spinning ? ' spin' : '') + '" style="' + st + '"><img src="' + au.img + '" alt="Escut de l’' + au.nom + '"><span class="nom" style="color:' + au.hex + '">' + au.nom + '</span><span class="cnt">' + S.count[i] + ' / ' + S.quota[i] + '</span></div>';
    }).join('');
    const r = $('result');
    if (S.result >= 0 && !moving) {
      const au = AULES[S.result];
      r.style.borderColor = au.hex; r.style.boxShadow = '0 0 50px -8px ' + au.hex;
      r.innerHTML = '<img src="' + au.img + '" alt=""><span>Aprenent ' + S.log[0].n + ' <span style="color:#a59dc2;font-weight:600">→</span> <span style="color:' + au.hex + '">' + au.nom + '</span></span>';
      r.classList.remove('hidden');
    } else r.classList.add('hidden');
    $('logwrap').classList.toggle('hidden', !S.log.length);
    $('log').innerHTML = S.log.slice(0, 10).map((l) => '<span class="chip" style="border-color:' + AULES[l.a].hex + '">' + l.n + ' · ' + AULES[l.a].curt + '</span>').join('');
  }
  if (S.step === 'done') {
    $('donetxt').textContent = 'Repartiment de ' + S.total + ' aprenents entre les cinc aules. Apunteu a quina aula ha anat cada aprenent segons el seu número.';
    $('summary').innerHTML = AULES.map((au, i) => {
      const nums = S.log.filter((l) => l.a === i).map((l) => l.n).sort((x, y) => x - y);
      return '<div class="card" style="border-color:' + au.hex + '"><img src="' + au.img + '" alt="Escut de l’' + au.nom + '"><span class="nom" style="color:' + au.hex + '">' + au.nom + '</span><span class="big">' + nums.length + '</span><span class="list">Aprenents: ' + (nums.length ? nums.join(', ') : '—') + '</span></div>';
    }).join('');
  }
}

function clearTimers() { if (iv) { clearInterval(iv); iv = null; } timers.forEach(clearTimeout); timers = []; }

function start() {
  const n = parseInt($('total').value, 10);
  if (!(n >= 5 && n <= 40)) { $('askmsg').textContent = 'Escriu un nombre d’alumnes entre 5 i 40.'; $('askmsg').classList.remove('hidden'); return; }
  $('askmsg').classList.add('hidden');
  const b = Math.floor(n / 5), rem = n % 5;
  const order = [0,1,2,3,4].sort(() => Math.random() - 0.5);
  const quota = [b, b, b, b, b];
  for (let i = 0; i < rem; i++) quota[order[i]]++;
  clearTimers();
  Object.assign(S, { step: 'draw', total: n, quota, count: [0,0,0,0,0], log: [], spinning: false, stopping: false, hi: -1, result: -1 });
  render();
}

function pressA() {
  if (S.step !== 'draw' || S.spinning || S.stopping) return;
  if (assigned() >= S.total) { S.step = 'done'; render(); return; }
  S.spinning = true; S.result = -1; S.hi = 0; render();
  iv = setInterval(() => { S.hi = (S.hi + 1) % 5; render(); }, 90);
}

function shake() {
  if (S.step !== 'draw' || !S.spinning || S.stopping) return;
  const left = S.quota.map((q, i) => q - S.count[i]);
  let r = Math.random() * left.reduce((a, b) => a + b, 0), target = 0;
  for (let i = 0; i < 5; i++) { if (r < left[i]) { target = i; break; } r -= left[i]; }
  clearInterval(iv); iv = null;
  S.stopping = true; render();
  const steps = ((target - S.hi + 5) % 5) + 10;
  let acc = 0;
  for (let k = 1; k <= steps; k++) {
    acc += 90 + Math.round(330 * Math.pow(k / steps, 2));
    const last = k === steps;
    timers.push(setTimeout(() => {
      if (!last) { S.hi = (S.hi + 1) % 5; render(); return; }
      S.count[target]++;
      S.log.unshift({ n: assigned(), a: target });
      Object.assign(S, { hi: target, result: target, spinning: false, stopping: false });
      render();
    }, acc));
  }
}

function mbStatus(on, msg) {
  $('mbdot').style.background = on ? '#a6d160' : '#6f6890';
  $('mbtxt').textContent = on ? 'micro:bit connectada' : 'micro:bit no connectada';
  $('connect').classList.toggle('hidden', on);
  $('mbmsg').textContent = msg || '';
  $('mbmsg').classList.toggle('hidden', !msg);
}

async function connect() {
  if (!('serial' in navigator)) { mbStatus(false, 'Aquest navegador no pot connectar-se a la micro:bit. Fes servir Chrome o Edge en un ordinador o Chromebook.'); return; }
  try {
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0d28 }] });
    await port.open({ baudRate: 115200 });
    mbStatus(true, '');
    const dec = new TextDecoderStream();
    port.readable.pipeTo(dec.writable).catch(() => {});
    const reader = dec.readable.getReader();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim().toUpperCase();
        buf = buf.slice(i + 1);
        if (line === 'A') pressA();
        else if (line === 'SHAKE' || line === 'S') shake();
      }
    }
    mbStatus(false, 'La micro:bit s’ha desconnectat.');
  } catch (e) {
    if (e && e.name === 'NotFoundError') mbStatus(false, 'No s’ha triat cap micro:bit.');
    else if (e && e.name === 'NetworkError') mbStatus(false, 'La micro:bit està ocupada. Tanca les pestanyes de MakeCode i torna-ho a provar.');
    else mbStatus(false, 'No s’ha pogut connectar la micro:bit. Desendolla-la, torna-la a endollar i prova-ho de nou.');
  }
}

$('total').addEventListener('input', () => { $('askmsg').classList.add('hidden'); render(); });
$('inc').addEventListener('click', () => { $('total').value = Math.min(40, (parseInt($('total').value, 10) || 0) + 1); render(); });
$('dec').addEventListener('click', () => { $('total').value = Math.max(5, (parseInt($('total').value, 10) || 6) - 1); render(); });
$('start').addEventListener('click', start);
$('btnA').addEventListener('click', pressA);
$('btnS').addEventListener('click', shake);
$('connect').addEventListener('click', connect);
$('reset').addEventListener('click', () => { clearTimers(); Object.assign(S, { step: 'ask', count: [0,0,0,0,0], log: [], result: -1, hi: -1, spinning: false, stopping: false }); render(); });
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'a' || e.key === 'A') pressA();
  if (e.key === 's' || e.key === 'S') shake();
});
render();
</script>
</body>
</html>
